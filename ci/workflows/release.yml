name: Build Apps (APK + Desktop)

# ---------------------------------------------------------------------------
# یک اجرا -> همه‌ی خروجی‌های قابل نصب:
#   • اندروید : app-debug.apk و app-release-unsigned.apk
#   • ویندوز  : RFTester-windows.exe (تک‌فایل، بدون نیاز به پایتون)
#   • مک      : RFTester-macos
#   • لینوکس  : RFTester-linux
#   • همه‌جا  : RFTester.pyz (تک‌فایل پایتونی، بدون وابستگی)
#
# اجرا: تب Actions -> Build Apps -> Run workflow
# اگر روی یک تگ (مثلاً v1.0.0) پوش شود، یک Release هم با همین فایل‌ها ساخته می‌شود.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APKs
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/RFTester-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
             out/RFTester-release-unsigned.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            out: RFTester-windows.exe
            sep: ";"
          - os: macos-latest
            label: macos
            out: RFTester-macos
            sep: ":"
          - os: ubuntu-latest
            label: linux
            out: RFTester-linux
            sep: ":"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build single-file app
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile \
            --name "${{ matrix.out }}" \
            --add-data "desktop/web${{ matrix.sep }}web" \
            --paths desktop \
            --hidden-import esp_protocol \
            --hidden-import simulator \
            --hidden-import rf_tester_gui \
            desktop/launcher.py

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: dist/${{ matrix.out }}*
          if-no-files-found: error

  zipapp:
    name: Portable .pyz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m zipapp desktop -o RFTester.pyz -p "/usr/bin/env python3" -c
      - uses: actions/upload-artifact@v4
        with:
          name: portable-pyz
          path: RFTester.pyz

  release:
    name: Publish Release
    needs: [android, desktop, zipapp]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
